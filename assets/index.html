<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QHome</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230C5560'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23D8B45C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>QHome</div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="rail-foot">
      <div class="stat" id="statMqtt"><span class="dot"></span><span class="lbl">MQTT</span></div>
      <div class="lang" id="lang" role="group" aria-label="Language"></div>
      <div class="ver" id="ver"></div>
    </div>
  </aside>
  <div id="content">
    <header id="top">
      <div id="chips" class="chips"></div>
      <span class="grow"></span>
      <span class="muted" id="dirtyTxt"></span>
      <button class="btn" id="bUndo" hidden></button>
      <button class="btn primary" id="bSave" disabled></button>
    </header>
    <div id="errbox" role="alert" hidden></div>
    <main id="main"></main>
    <section id="blocksView" hidden>
      <div id="blocklyDiv"></div>
      <div id="blocksFoot"></div>
    </section>
  </div>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<script src="/static/vendor/blockly/blockly_compressed.js"></script>
<script src="/static/vendor/blockly/blocks_compressed.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/help.js"></script>
<script src="/static/blocks.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
